function openHelpModal(){
  const topics=[
   ['Getting started','play','Play & sustain','<h3>Play &amp; sustain</h3><p>Click or touch a pad to sound it. Drag across the canvas to move the voice through adjacent pads; multitouch gives independent fingers and voices. Hold Shift, or tap <b>SUS</b>, to keep released notes alive.</p><p>The pad is determined by the shared Voronoi map, not only by its row. Identical frequencies can merge into one region, while exact-frequency highlights remain visible across rows.</p>'],
   ['Getting started','navigation','Rows, views & scrolling','<h3>Rows, views &amp; scrolling</h3><p>Rows are scale lanes. Tabs contain independently scrollable stacks of views, and each view has its own horizontal frequency range, ruler, and bottom range control.</p><ul><li>Wheel or touchpad over the playing area: scroll vertically.</li><li>Right scrollbar: drag the visible stack position.</li><li>Bottom range bar: drag the range or handles to pan/zoom.</li><li>Row bottom edge: resize. Row left handle: reorder or move between views.</li><li>Collapsed-row run: use the restore button to expand the whole run.</li></ul>'],
   ['Getting started','expressions','Pitch expressions','<h3>Pitch expressions</h3><p>An <b>f₀</b> expression may use notes, arithmetic, cents, row references, or group references: <code>C3*3/2</code>, <code>A4+150c</code>, <code>white/2</code>, or <code>keys</code>. A group resolves to the most recently played pad in any member row, including another tab.</p><p>Cents use 100¢ per equal-tempered semitone. The header and Spawn use the soft expression form to preserve musical ratios; the row editor’s Simplify button deliberately performs a stronger octave/note rewrite.</p>'],
   ['Getting started','spawn','Spawn & assign','<h3>Spawn &amp; assign</h3><h4>Spawn</h4><p>The toolbar Spawn uses a template row (type/scale/sound/pattern) and only replaces f₀ from the clicked pad ratio. Use a row&rsquo;s <b>Tpl</b> button (eyedropper workflow) to copy that row into the toolbar template.</p><p>Row-header Spawn creates a shifted copy of that specific row instead. Hold Shift while spawning to force absolute-pitch simplification.</p><h4>Assign</h4><p>Arm Assign, select a pad, then press a computer key or a MIDI note. Normal bindings follow the row as f₀ changes. Hold Shift to create a fixed-Hz binding and ruler pin instead. In the Bindings manager, a single trigger can play a sequence/chord using <code>row*ratio, row*ratio, =440</code>.</p>'],
   ['Getting started','projects','Projects & sharing','<h3>Projects &amp; sharing</h3><p><b>Save</b> stores named projects in this browser and thumbnails their current canvas. <b>Load</b> opens the project browser. <b>New</b> starts a small blank scene.</p><p><b>Share</b> compresses the workspace into a URL fragment. Settings also provides raw JSON export/import and the project browser supports files. The automatic session restore is separate from named saves.</p>'],
   ['Row settings','roweditor','Overview','<h3>Row settings overview</h3><p>Open a row by double-clicking its label or pressing its gear button. Edit the ID, label, comma-separated group memberships, f₀ expression, scale type, mute state, colours, and per-row synthesis.</p><p>An empty label displays the row ID. A muted row is still playable and still updates its last frequency, so it can be a silent tuning/controller source for rows that reference it.</p>'],
   ['Row settings','harmonic','Harmonic ladder','<h3>Harmonic ladder</h3><p>The ladder places integer multiples above f₀ and their reciprocal ratios below it: <code>×1, ×2, ×3…</code> and <code>÷2, ÷3…</code>.</p><h4>Fineness 1/n</h4><p>Fineness inserts subdivisions without creating an expanding hole around the root. For 1/2, the sequence is <code>×1, ×3/2, ×2, ×5/2…</code>, mirrored as <code>÷3/2, ÷2, ÷5/2…</code>. This is useful for overtone-series studies and for instrument/fingering demonstrations.</p>'],
   ['Row settings','cloud','Harmonic 2D cloud','<h3>Harmonic 2D cloud</h3><p>The cloud lays out a true lattice at <code>f₀·a·2ᵇ</code>. Several points can have the same frequency at different vertical positions, so octave-related points form shaped, partially merged Voronoi regions.</p><ul><li><b>a max</b>: maximum harmonic component, up to 1024 (default 32).</li><li><b>Y curve γ</b>: redistributes vertical spacing; smaller values spread fine divisions, larger values compress them.</li><li><b>Subharmonics</b>: mirrors <code>f₀·2ᵇ/a</code> below the centre. With it off, the overtone arc uses the full lane.</li></ul>'],
   ['Row settings','chromatic','Chromatic','<h3>Chromatic equal divisions</h3><p>The row generates <code>f₀·2^(k/steps)</code>. Tone zero is f₀; surrounding pads are labelled by positive and negative step offsets.</p><p>Steps/octave ranges from 2 to 31. Use 12 for 12-TET, or 19/22 and similar divisions to study nonstandard equal temperaments. A chromatic row with a 12-step piano light/dark pattern makes a conventional keyboard reference.</p>'],
   ['Row settings','explicit','Explicit ratios & presets','<h3>Explicit ratios</h3><p>Enter one interval per line: <code>ratio [, colour [, label]]</code>. Ratios are unitless multipliers of f₀. Examples are <code>5/4</code>, <code>9/8</code>, <code>2^(3/12)</code>, <code>386c</code>, and <code>386¢</code>. For a label without a custom colour, leave the colour field empty: <code>1, , Sa</code>.</p><h4>Useful presets</h4><ul><li>Piano and Janko: Black/White keys and whole-tone rows.</li><li>Just intonation: major, minor, Lydian, pentatonic, and Pythagorean.</li><li>Ragas with sargam names: Bhairav, Shree, Todi, Kafi, Bhairavi, and Khamaj.</li><li>22 named shrutis, quarter-comma meantone, Werckmeister III, Vallotti.</li><li>Slendro/Pelog approximations, Maqam Bayati, and harmonic segments.</li></ul><p><b>Repeat every (oct)</b> controls the octave period copied across the visible range. Lines beginning with # are comments; backslash escapes commas, backslashes, and newlines.</p>'],
   ['Row settings','appearance','Colour & patterns','<h3>Colour &amp; light/dark patterns</h3><p>Base hue follows the frequency’s position in an octave. <b>Colour mix</b> blends from rainbow toward the row swatch; an explicit pad’s own colour replaces that endpoint when present.</p><p>The light/dark pattern has a selectable length, a strength/opacity control, and up to 64 clickable swatches. Tone index means the harmonic in a ladder/cloud, the step offset in a chromatic row, or the list position in an explicit row. This lets piano patterns, odd-harmonic patterns, and custom repeating layouts share the same mechanism.</p>'],
   ['Row settings','links','Links & repetition','<h3>Links &amp; repetition</h3><p>Rows can reference another row ID or a group in f₀. The result is the referenced row’s/group’s last-played pitch, so muted controller rows can retune an entire instrument.</p><p>Group names are comma-separated memberships. Group references work across tabs. Renaming a row updates expressions and bindings; deleting a row substitutes its f₀ expression where possible. Explicit-ratio rows have a separate octave repeat control, so repeated scale copies need not be typed manually.</p>'],
   ['Row settings','rowsound','Per-row sound','<h3>Per-row sound</h3><p>By default a row inherits the global synthesizer. Enabling Custom sound supplies a waveform and ADSR envelope for that row.</p><p>The custom-partial editor creates additive sine components at arbitrary ratios to f₀. Each partial has gain and an optional decay: ratios can be integer harmonics or irrational numbers for bell/rod-like spectra. Saw, square, triangle, bell, rod, and other presets provide starting points.</p>'],
   ['Global settings','tuning','Tuning & synth','<h3>Tuning &amp; global synth</h3><h4>A4 reference</h4><p>A4 sets the absolute conversion for note names, 12-TET annotations, and frequency labels. Changing it retunes note-name expressions without changing ratio-only arithmetic.</p><h4>Default sound</h4><p>Wave, partials, volume, and ADSR provide the inherited instrument for rows without overrides. Attack/decay/release are seconds/ms controls; sustain is a percentage level. Custom partial ratios and decays are per-component, not forced to integer harmonics.</p>'],
   ['Global settings','visual','Spectrum & guides','<h3>Spectrum &amp; guides</h3><p>The FFT is drawn behind the 12-TET ruler using the active view’s logarithmic frequency range. Larger FFT sizes give better low-frequency precision but update more slowly.</p><ul><li><b>Freq cursor:</b> a vertical line at every sounding fundamental.</li><li><b>Partials:</b> optional differently coloured lines for the actual sounding partials.</li><li><b>Chord arcs:</b> show/hide interval overlays for active chords.</li><li><b>Halo:</b> shows nearby pad frequencies out to a cents radius, separately from exact matches.</li><li><b>Voronoi bias:</b> changes the importance of vertical vs horizontal distance when partitioning pads.</li><li><b>Oscilloscope:</b> togglable scope with zero-crossing, first-note, and last-note triggers.</li><li><b>Cents digits:</b> controls display precision; entering c or ¢ works in fields.</li></ul>'],
   ['Global settings','midiout','MIDI output','<h3>MIDI output</h3><p>MIDI pitch is nominally 12-TET, and pitch bend is a <em>channel-wide</em> controller. If two simultaneous notes use different microtonal bends, one shared channel would move both notes. MPE mode therefore allocates a fresh channel to each live note (channels 2–16), so every note can carry its own note number and bend.</p><p><b>Bend range</b> must match the receiving synth’s range. Larger ranges permit wider microtonal and glissando excursions, but reduce bend resolution. If the receiver has only conventional monophonic MIDI, use Monophonic mode and choose the hardware’s listening channel; notes are legato and bend is shared, as a last-resort approximation.</p>'],
   ['Global settings','midiin','MIDI input & bindings','<h3>MIDI input &amp; bindings</h3><p>Choose an input and an incoming channel (or Omni). In Assign mode, select a pad and play a MIDI key to bind that note exactly like a computer letter. A normal binding follows the target row as it retunes; Shift makes it fixed frequency.</p><p>This supports controller workflows: bind a MIDI note to a muted root pad, reference that pad from another row, then bind a second register of notes to pads on the follower row. The first note silently retunes the follower, while the others perform on it.</p><p>MIDI input bindings and MIDI output targets are independent choices, so the same hardware can be used for input, output, or split roles on different channels.</p>'],
   ['Global settings','other','Bindings & workspace','<h3>Bindings &amp; workspace</h3><p>The Bindings manager lists keyboard and MIDI bindings. Follow bindings store the target row and multiplier; fixed bindings store an absolute frequency and pin it to the ruler.</p><p>Workspace export/import carries settings, rows, tabs, views, bindings, and synth state. The Voronoi, spectrum, and interface settings are part of the workspace rather than the synthesis engine itself.</p>']
  ];
  const groups=[];
  topics.forEach(t=>{ if(!groups.includes(t[0])) groups.push(t[0]); });
  openModal(`<div class="helpShell">
    <div class="helpTop"><div><h2>ScaleLab help</h2><span class="credit">Created by Jiří Programagor</span></div><span class="credit">v${APP_VERSION}</span></div>
    <div class="helpLayout">
      <nav class="helpTree">${groups.map(g=>`<div class="helpGroup"><span>${g}</span>${topics.filter(t=>t[0]===g).map(t=>`<button class="helpTopic" data-help="${t[1]}">${t[2]}</button>`).join('')}</div>`).join('')}</nav>
      <article class="helpContent" id="helpContent"></article>
    </div>
    <div class="helpFoot"><button class="accent" id="helpWhats">What's new</button><button id="helpClose">Close</button></div>
  </div>`,'help');
  const show=id=>{
    const topic=topics.find(t=>t[1]===id)||topics[0];
    document.getElementById('helpContent').innerHTML=topic[3];
    document.getElementById('helpContent').scrollTop=0;
    modalBody.querySelectorAll('.helpTopic').forEach(b=>b.classList.toggle('active',b.dataset.help===topic[1]));
  };
  modalBody.querySelectorAll('.helpTopic').forEach(b=>b.onclick=()=>show(b.dataset.help));
  document.getElementById('helpClose').onclick=closeModal;
  document.getElementById('helpWhats').onclick=openWhatsNewModal;
  show('play');
}

function partialsHTML(prefix,parts){
  return `<div style="flex:1;display:flex;gap:4px;align-items:flex-start;flex-wrap:wrap">`+
   parts.map((p,i)=>`<div class="adsr-group" style="height:100%;justify-content:flex-start">
     <input type="range" class="${prefix}G" data-i="${i}" min="0" max="100" value="${Math.round(p.g*100)}">

     <input type="text" class="${prefix}R pRatio" data-i="${i}" value="${+p.r.toFixed(4)}" spellcheck="false" title="ratio × f₀">

function readPartialsUI(prefix){
  const out=[];
  modalBody.querySelectorAll('.'+prefix+'R').forEach(inp=>{
    const i=+inp.dataset.i;
    const rv=tryEvalRatio(inp.value.trim());
    const gsl=modalBody.querySelector('.'+prefix+'G[data-i="'+i+'"]');
    const din=modalBody.querySelector('.'+prefix+'D[data-i="'+i+'"]');
    const dv=parseFloat(din.value);
    out.push({r:(rv!=null?rv:(i+1)), g:+(gsl?gsl.value:0)/100, d:(isFinite(dv)&&dv>0)?Math.min(30,dv):0});
  });
  return out;
}
function wirePartials(prefix,getParts,setParts,after){
  const re=()=>{
    const row=modalBody.querySelector('#'+prefix+'row');
    row.innerHTML='<label>Partials</label>'+partialsHTML(prefix,getParts());
    wire();
  };
  const wire=()=>{
    modalBody.querySelectorAll('.'+prefix+'G').forEach(sl=>{ sl.oninput=e=>{
      getParts()[+sl.dataset.i].g=+e.target.value/100;
      document.getElementById(prefix+'Gv'+sl.dataset.i).textContent=e.target.value; if(after)after(); };});
    modalBody.querySelectorAll('.'+prefix+'R').forEach(inp=>{ inp.onchange=e=>{
      const v=tryEvalRatio(inp.value.trim());
      if(v==null){ inp.value=+getParts()[+inp.dataset.i].r.toFixed(4); inp.style.borderColor='var(--danger)';
        setTimeout(()=>inp.style.borderColor='',900); return; }
      getParts()[+inp.dataset.i].r=v; if(after)after(); };});
    modalBody.querySelectorAll('.'+prefix+'D').forEach(inp=>{ inp.onchange=e=>{
      const v=parseFloat(inp.value);
      getParts()[+inp.dataset.i].d=(isFinite(v)&&v>0)?Math.min(30,v):0;
      inp.value=getParts()[+inp.dataset.i].d||''; if(after)after(); };});
    const add=modalBody.querySelector('.'+prefix+'Add'), del=modalBody.querySelector('.'+prefix+'Del');
    if(add) add.onclick=e=>{ e.preventDefault(); const ps=getParts();
      if(ps.length<12){ ps.push({r:ps.length+1,g:.2,d:0}); setParts(ps); re(); } };
    if(del) del.onclick=e=>{ e.preventDefault(); const ps=getParts();
      if(ps.length>1){ ps.pop(); setParts(ps); re(); } };
    modalBody.querySelectorAll('.'+prefix+'Pre').forEach(b=>{ b.onclick=e=>{ e.preventDefault();
      setParts(PART_PRESETS[b.dataset.p].map(p=>({...p}))); re(); if(after)after(); };});
  };
  wire();
}

function bindingInfo(b){
  if(Array.isArray(b.seq)&&b.seq.length){
    return b.seq.map(s=>bindingInfo(s)).join(' · ');
  }
  const r=findRow(b.rowId);
  const f=b.fixed!=null? b.fixed : (r&&r._f0? r._f0*b.mult : null);
  return b.fixed!=null? 'fixed '+fmtHz(b.fixed)+' Hz'
    : `${b.rowId} ×${(+b.mult).toPrecision(4)}${f? ' ≈ '+fmtHz(f)+' Hz' : ''}`;
}
function formatBindingSeq(b){
  const seq=(Array.isArray(b.seq)&&b.seq.length)?b.seq:[b];
  return seq.map(s=>s.fixed!=null?('='+fmtNum(s.fixed)):(s.rowId+'*'+fmtNum(s.mult||1))).join(', ');
}
function parseBindingSeq(txt,fallback){
  const raw=txt.split(',').map(s=>s.trim()).filter(Boolean);
  if(!raw.length) return null;
  const seq=[];
  for(const item of raw){
    if(item.startsWith('=')){
      const f=parseFloat(item.slice(1));
      if(!(f>0&&isFinite(f))) return null;
      seq.push({fixed:f,rowId:'',mult:1});
      continue;
    }
    const m=item.match(/^([A-Za-z]\w*)\*(.+)$/);
    if(!m) return null;
    const mult=tryEvalRatio(m[2]);
    if(mult==null||!(mult>0)) return null;
    seq.push({rowId:m[1],mult,fixed:null});
  }
  if(!seq.length) return null;
  if(seq.length===1){
    const s=seq[0];
    if(s.fixed!=null) return {rowId:fallback.rowId,mult:fallback.mult,fixed:s.fixed,seq:[s]};
    return {rowId:s.rowId,mult:s.mult,fixed:null,seq:[s]};
  }
  const s0=seq[0].fixed!=null?{rowId:fallback.rowId,mult:1,fixed:seq[0].fixed}:seq[0];
  return {rowId:s0.rowId,mult:s0.mult,fixed:s0.fixed!=null?s0.fixed:null,seq};
}

    const isM=isMidiBindKey(k);
    const keyCtl=isM
      ? `<input type="number" class="bkMidi" min="0" max="127" value="${+k.slice(1)}" style="width:58px;flex:none" title="MIDI note number (0–127)">
         <span style="font-size:.68rem;color:#9ab;font-family:monospace;flex:none">${bindLabel(k)}</span>`
      : `<input type="text" class="bkKey" value="${k===' '?'␣':k.toUpperCase()}" maxlength="1" style="width:34px;flex:none;text-align:center" title="Bound key">`;
    return `<div class="frow" data-k="${k.replace(/"/g,'&quot;')}">
      ${keyCtl}
      <select class="bkType" style="flex:none">
        <option value="follow"${b.fixed==null?' selected':''}>follow</option>
        <option value="fixed"${b.fixed!=null?' selected':''}>fixed Hz</option>
      </select>
      <input type="text" class="bkSeq" value="${formatBindingSeq(b).replace(/"/g,'&quot;')}" spellcheck="false" style="min-width:210px;flex:1" title="Sequence: row*ratio, row*ratio, =440">
      <span class="bkInfo" style="flex:1;font-size:.68rem;color:#9ab;font-family:monospace">${bindingInfo(b)}</span>
      <button class="bkDel" style="flex:none">✕</button>
    </div>`;
  };
  openModal(`<h2>Key bindings</h2>
  <div class="mhelp" style="margin-left:0">Assign mode: click a pad, press a key OR play a MIDI note = follow row f₀ · Shift held = fixed Hz. Sequence format: row*ratio, row*ratio, =440</div>
  <div id="bkList">${
    list.length? list.map(rowHtml).join('')
    :'<div class="mhelp" style="margin-left:0">No bindings yet — Assign on the canvas.</div>'
  }</div>
  <div class="mbtns"><button id="bkClear" style="margin-right:auto">Clear all</button>
  <button id="bkClose">Close</button></div>`);
  modalBody.querySelectorAll('.frow[data-k]').forEach(rowEl=>{
    const k=rowEl.dataset.k, b=bindings.get(k); if(!b) return;
    const typeSel=rowEl.querySelector('.bkType'), info=rowEl.querySelector('.bkInfo');
    typeSel.onchange=()=>{
      const cur=bindings.get(k); if(!cur) return;
      if(typeSel.value==='fixed'){
        refreshF0s();
        const r=findRow(cur.rowId);
        cur.fixed=(r&&r._f0)? r._f0*cur.mult : 440;
      } else cur.fixed=null;
      cur.seq=[{rowId:cur.rowId,mult:cur.mult,fixed:cur.fixed}];
      info.textContent=bindingInfo(cur); rebuild();
    };
    const seqInp=rowEl.querySelector('.bkSeq');
    seqInp.onchange=()=>{
      const cur=bindings.get(k); if(!cur) return;
      const parsed=parseBindingSeq(seqInp.value,cur);
      if(!parsed){ seqInp.value=formatBindingSeq(cur); seqInp.style.borderColor='var(--danger)';
        setTimeout(()=>seqInp.style.borderColor='',900); return; }
      bindings.set(k,parsed);
      info.textContent=bindingInfo(parsed);
      typeSel.value=parsed.fixed!=null?'fixed':'follow';
      rebuild();
    };
    rowEl.querySelector('.bkDel').onclick=()=>{ bindings.delete(k); openBindingsModal(); rebuild(); };
    const keyInp=rowEl.querySelector('.bkKey');
    if(keyInp) keyInp.onchange=()=>{
      const nk=keyInp.value.toLowerCase();
      if(!nk||nk.length!==1||nk===k){ keyInp.value=k; return; }
      if(bindings.has(nk)){ keyInp.value=k; return; }
      const cur=bindings.get(k); bindings.delete(k); bindings.set(nk,cur);
      openBindingsModal(); rebuild();
    };
    const minp=rowEl.querySelector('.bkMidi');
    if(minp) minp.onchange=()=>{
      const n=Math.max(0,Math.min(127,Math.round(+minp.value||0)));
      const nk='m'+n;
      if(nk===k){ openBindingsModal(); return; }
      if(bindings.has(nk)){ minp.value=k.slice(1); return; }
      const cur=bindings.get(k); bindings.delete(k); bindings.set(nk,cur);
      openBindingsModal(); rebuild();
    };
  });
  document.getElementById('bkClear').onclick=()=>{ bindings.clear(); openBindingsModal(); rebuild(); };
  document.getElementById('bkClose').onclick=closeModal;
}

/* ================= workspace export / import ================= */
function importWSSafe(txt){
  const d=JSON.parse(txt);
  if(!d||!Array.isArray(d.rows)) throw new Error('not a workspace JSON');
  const rowObjs=d.rows.map(o=>mkRow(o));
  rowObjs.forEach(r=>{ r.partials=partsNormalize(r.partials); });
  const byId=new Map(rowObjs.map(r=>[r.id,r]));
  let mx=0; for(const r of rowObjs){ const m=r.id.match(/^row(\d+)$/); if(m) mx=Math.max(mx,+m[1]); }
  uid=Math.max(uid,mx+1);
  for(const t of tabs) for(const v of t.views) if(v.panel) v.panel.remove();
  tabs=[];
  const buildView=(dv)=>{
    const v=mkView({ xMin:+dv.xMin||Math.log2(90), xMax:+dv.xMax||Math.log2(1600), rows:[] });
    v.ruler = dv.ruler!==false;
    v.xMin=Math.max(DOML,Math.min(DOMH-MINSPAN,v.xMin));
    v.xMax=Math.max(v.xMin+MINSPAN,Math.min(DOMH,v.xMax));
    return v;
  };
  const used=new Set();
  const placeRows=(v,dv)=>{
    for(const id of (dv.rows||[])){
      const r=byId.get(id);
      if(r&&!used.has(id)){ v.rows.push(r); used.add(id); }
    }
  };
  if(Array.isArray(d.tabs)&&d.tabs.length){
    d.tabs.forEach(dt=>{
      const t=mkTab(dt.name||'Tab');
      t.views=[];
      for(const dv of (dt.views||[])){
        const v=buildView(dv); placeRows(v,dv); t.views.push(v);
      }
      if(!t.views.length) t.views.push(mkView({}));
      t.scr=+dt.scr||0;
      tabs.push(t);
    });
  } else if(Array.isArray(d.views)&&d.views.length){
    const t=mkTab('Main'); t.views=[];
    for(const dv of d.views){
      const v=buildView(dv); placeRows(v,dv); t.views.push(v);
    }
    if(!t.views.length) t.views.push(mkView({}));
    tabs.push(t);
  } else {
    const t=mkTab('Main'); t.views=[];
    const v=mkView({rows:[]});
    if(d.view){
      v.xMin=Math.max(DOML,Math.min(DOMH-0.3,+d.view.xMin||v.xMin));
      v.xMax=Math.max(v.xMin+0.3,Math.min(DOMH,+d.view.xMax||v.xMax));
    }
    v.rows.push(...rowObjs); rowObjs.forEach(r=>used.add(r.id));
    t.views.push(v);
    tabs.push(t);
  }
  const leftover=rowObjs.filter(r=>!used.has(r.id));
  if(leftover.length) tabs[tabs.length-1].views[tabs[tabs.length-1].views.length-1].rows.push(...leftover);
  activeTab=tabs[Math.max(0,Math.min(tabs.length-1,+d.activeTab||0))];
  views=activeTab.views;
  view.yScroll=activeTab.scr||0;
  if(d.settings) Object.assign(settings,d.settings);
  document.body.classList.toggle('hideSliders',!!settings.slidersHidden);
  if(d.synth) Object.assign(synth,d.synth);
  synth.partials=partsNormalize(synth.partials)||defaultParts();
  if(d.midi){
    midi.bendRange=d.midi.bendRange||48; midi.mono=!!d.midi.mono;
    midi.monoCh=Math.max(1,Math.min(16,Math.round(+d.midi.monoCh||1)));
    midi.outId=d.midi.outId||midi.outId;
    midiIn.channel=+(d.midi.inChannel||0);
    midiIn.inId=d.midi.inId||'';
  }
  if(master) master.gain.value=synth.vol*0.9;
  ensureAnalyser();
  spawnTemplate=d.spawnTemplate?rowTemplateFrom(d.spawnTemplate):spawnTemplate;
  ensureSpawnTemplate();
  bindings=new Map((d.bindings||[])
    .filter(b=>b&&typeof b.key==='string'&&(b.key.length===1||isMidiBindKey(b.key)))
    .map(b=>[b.key,{
      rowId:b.rowId,mult:b.mult,fixed:(typeof b.fixed==='number'&&b.fixed>0)?b.fixed:null,
      seq:Array.isArray(b.seq)?b.seq.filter(s=>s&&((s.rowId&&isFinite(s.mult))||((typeof s.fixed==='number')&&s.fixed>0)))
        .map(s=>({rowId:s.rowId||'',mult:(+s.mult||1),fixed:(typeof s.fixed==='number'&&s.fixed>0)?s.fixed:null})):null
    }]));
  pendingPad=null; spawnArm=null; noteHist.length=0; pointers.clear(); releaseAll();
  renderTabbar(); rebuild();
}
function exportWS(){
  return JSON.stringify({v:3,
    settings:{...settings},
    synth:{...synth},
    midi:{bendRange:midi.bendRange,mono:midi.mono,monoCh:midi.monoCh,outId:midi.outId,inChannel:midiIn.channel,inId:midiIn.inId},
    tabs:tabs.map(t=>({name:t.name,scr:(t===activeTab?view.yScroll:t.scr||0),
      views:t.views.map(v=>({xMin:v.xMin,xMax:v.xMax,ruler:v.ruler!==false,rows:v.rows.map(r=>r.id)}))})),
    activeTab:tabs.indexOf(activeTab),
    rows:allRows().map(r=>({id:r.id,label:r.label,expr:r.expr,type:r.type,groups:r.groups,ratiosTxt:r.ratiosTxt,
      repeatOct:r.repeatOct,etDiv:r.etDiv,amax:r.amax,hdiv:r.hdiv,subs:r.subs,yCurve:r.yCurve,colMix:r.colMix,color:r.color,
      usePat:r.usePat,patLen:r.patLen,pat:r.pat,patOp:r.patOp,mute:r.mute,wave:r.wave,partials:r.partials,
      adsr:r.adsr,height:r.height,lastFreq:r.lastFreq,lastExpr:r.lastExpr})),
    bindings:[...bindings].map(([key,b])=>({key,rowId:b.rowId,mult:b.mult,fixed:b.fixed,seq:b.seq||null})),
    spawnTemplate:spawnTemplate?rowTemplateFrom(spawnTemplate):null
  },null,1);
}

function biasText(v){
  if(v===50) return '0.50 · isotropic ✦';
  if(v===0)  return '0.00 · rows isolated (per-row bisection)';
  if(v===100)return '1.00 · frequency columns (y ignored)';
  return (v/100).toFixed(2)+(v<50?' · lean rows':' · lean columns');
}

/* ================= projects: storage, thumbnails, share ================= */
const store=(()=>{
  let ok=false;
  try{ localStorage.setItem('isocta.scalelab.t','1'); localStorage.removeItem('isocta.scalelab.t'); ok=true; }catch(e){ ok=false; }
  const mem=new Map();
  return {
    ok,
    get(k){ if(ok){ try{ return localStorage.getItem(k); }catch(e){} } return mem.has(k)?mem.get(k):null; },
    set(k,v){ if(ok){ try{ localStorage.setItem(k,v); return; }catch(e){} } mem.set(k,v); },
    del(k){ if(ok){ try{ localStorage.removeItem(k); return; }catch(e){} } mem.delete(k); }
  };
})();
const LS_PROJ='isocta.scalelab.projects', LS_AUTO='isocta.scalelab.autosave';
let activeProjectName='';
function setActiveProject(n){
  activeProjectName=n||'';
  const el=document.getElementById('projName');
  el.textContent=activeProjectName||'unsaved';
  el.classList.toggle('dim',!activeProjectName);
  el.title='Current project: '+(activeProjectName||'(unsaved)')+' — click to open Projects';
}
function readProjMap(){
  try{ const m=JSON.parse(store.get(LS_PROJ)||'{}'); return (m&&typeof m==='object')?m:{}; }
  catch(e){ return {}; }
}
function writeProjMap(m){
  try{ store.set(LS_PROJ,JSON.stringify(m)); return true; }
  catch(e){ return false; }
}
let autoT=0;
function autosaveNow(){
  try{ store.set(LS_AUTO, JSON.stringify({name:activeProjectName, savedAt:Date.now(), ws:JSON.parse(exportWS())})); }
  catch(e){}
}
function scheduleAutosave(){ clearTimeout(autoT); autoT=setTimeout(autosaveNow,1400); }
window.addEventListener('pagehide',autosaveNow);
function captureThumb(){
  const w=320,h=200,cv=document.createElement('canvas');
  cv.width=w; cv.height=h;
  const g=cv.getContext('2d');
  g.fillStyle='#0b0e13'; g.fillRect(0,0,w,h);
  try{
    const wrap=document.getElementById('cvwrap');
    const W=wrap.clientWidth||800, H=Math.max(1,wrap.clientHeight||400);
    const sc=Math.min(w/W,h/H);
    const ox=(w-W*sc)/2, oy=(h-H*sc)/2;
    for(const v of views){
      if(!v.cv) continue;
      g.save();
      g.beginPath(); g.rect(0,0,w,h); g.clip();
      g.drawImage(v.cv, 0,0, v.cv.width, v.cv.height, ox, oy+v.screenTop*sc, W*sc, v.panelH*sc);
      g.restore();
    }
  }catch(e){}
  try{ return cv.toDataURL('image/jpeg',.78); }catch(e){ return ''; }
}
function saveNow(name){
  const m=readProjMap();
  let rec={savedAt:Date.now(), thumb:captureThumb(), ws:JSON.parse(exportWS())};
  m[name]=rec;
  if(!writeProjMap(m)){
    rec.thumb=''; m[name]=rec;
    if(!writeProjMap(m)){ hint('⚠ save failed — storage unavailable or full'); return; }
  }
  setActiveProject(name);
  autosaveNow();
  hint('Saved "'+name+'"');
}
const DEMO_THUMB=(()=>{
  const c=document.createElement('canvas'); c.width=320; c.height=200;
  const g=c.getContext('2d');

  g.fillStyle=gr; g.fillRect(0,0,320,200);
  g.strokeStyle='rgba(255,160,40,.85)'; g.lineWidth=5;
  g.beginPath();
  for(let i=0;i<=8;i++){ const a=Math.PI/8+i*Math.PI/4, x=78+52*Math.cos(a), y=100+52*Math.sin(a);
    i?g.lineTo(x,y):g.moveTo(x,y); }
  g.stroke();
  g.fillStyle='#e9e6e0'; g.font='600 16px system-ui'; g.textAlign='center'; g.textBaseline='middle';
  g.fillText('Demo workspace',192,88);

    im.src=thumbSrc||'data:image/gif;base64,R0lGODlhAQABAAAAACw=';
    c.appendChild(im);

    const pd=document.createElement('div'); pd.className='pd'; pd.textContent=sub||'';
    c.appendChild(pd);
    const pb=document.createElement('div'); pb.className='pb';
    const bl=document.createElement('button'); bl.textContent='Load';
    bl.addEventListener('pointerdown',e=>e.stopPropagation());
    bl.onclick=e=>{ e.stopPropagation(); onload(); };
    pb.appendChild(bl);
    if(!isDemo){
      const bd=document.createElement('button'); bd.className='bd'; bd.textContent='✕'; bd.title='Delete project';
      bd.addEventListener('pointerdown',e=>e.stopPropagation());
      bd.onclick=e=>{ e.stopPropagation();
        if(bd.dataset.a){
          const mm=readProjMap(); delete mm[name]; writeProjMap(mm);
          openProjectsModal(); hint('Deleted "'+name+'"');
        } else {
          bd.dataset.a='1'; bd.textContent='sure?';
          setTimeout(()=>{ delete bd.dataset.a; bd.textContent='✕'; },2200);
        }
      };
      pb.appendChild(bd);
    }
    c.appendChild(pb);
    c.onclick=onload;
    grid.appendChild(c);
  };
  mkCard(DEMO_THUMB,'Demo workspace','built-in seed scene',doLoadDemo,true);
  for(const [name,rec] of entries){
    const d=rec.savedAt?new Date(rec.savedAt).toLocaleString():'';
    mkCard(rec.thumb||'',name,d,()=>doLoadProject(name),false);
  }
  if(!entries.length){
    const em=document.createElement('div'); em.className='mhelp';
    em.style.marginLeft='0';
    em.textContent='No saved projects yet — name one above (or toolbar Save).';
    grid.appendChild(em);
  }
  document.getElementById('pmSaveNew').onclick=()=>{
    const n=document.getElementById('pmName').value.trim();
    if(!n){ document.getElementById('pmName').focus(); return; }
    saveNow(n);
    openProjectsModal();
  };
  document.getElementById('pmName').onkeydown=e=>{
    if(e.key==='Enter'){ e.preventDefault(); document.getElementById('pmSaveNew').click(); }
    e.stopPropagation();
  };
  document.getElementById('pmExp').onclick=exportFile;
  document.getElementById('pmImp').onclick=()=>document.getElementById('fileInput').click();
  document.getElementById('pmClose').onclick=closeModal;
}
function exportFile(){
  const j=exportWS();
  const name=(activeProjectName||'scalelab-workspace').replace(/[^\w.-]+/g,'_');
  try{
    const blob=new Blob([j],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=name+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000);
    hint('Exported '+name+'.json');
  }catch(e){ hint('⚠ download blocked in this context — use ⚙ → Workspace Export (copy/paste)'); }
}

});

/* ================= share: gzip ↔ URL hash ================= */
function b64enc(bytes){
  let s='';
  for(let i=0;i<bytes.length;i+=8192) s+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function b64dec(s){
  s=s.replace(/-/g,'+').replace(/_/g,'/');
  while(s.length%4) s+='=';
  const bin=atob(s);
  const b=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) b[i]=bin.charCodeAt(i);
  return b;
}
async function gzipCompress(str){
  const data=new TextEncoder().encode(str);
  const out=await new Response(
    new Blob([data]).stream().pipeThrough(new CompressionStream('gzip'))
  ).arrayBuffer();
  return new Uint8Array(out);
}
async function gzipDecompress(bytes){
  return await new Response(
    new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))
  ).text();
}
async function shareWorkspace(){
  const j=exportWS();
  let payload='';
  try{
    if(typeof CompressionStream==='undefined') throw new Error('no gz');
    payload='w='+b64enc(await gzipCompress(j));
  }catch(e){
    payload='j='+b64enc(new TextEncoder().encode(j));
  }
  const base=location.href.split('#')[0];
  const url=base+'#'+payload;
  try{ history.replaceState(null,'','#'+payload); }catch(e){}
  const kind=payload[0]==='w'?'gzip':'raw';
  if(url.length>8000){
    hint('Share URL ready ('+url.length+' chars, '+kind+') — very long; some apps may truncate it');
  } else {
    hint('Share URL ready ('+url.length+' chars, '+kind+') — copying…');
  }
  try{
    await navigator.clipboard.writeText(url);
    hint('Share URL copied ('+url.length+' chars, '+kind+')');
  }catch(e){
    hint('Share URL set in the address bar ('+url.length+' chars, '+kind+') — copy it from there');
  }
}
async function loadFromHash(h){
  try{
    let json=null;
    if(h.startsWith('#w=')) json=await gzipDecompress(b64dec(h.slice(3)));
    else if(h.startsWith('#j=')) json=new TextDecoder().decode(b64dec(h.slice(3)));
    else return false;
    importWSSafe(json);
    setActiveProject('');
    hint('Loaded shared workspace from link — Save to keep it');
    return true;
  }catch(e){ hint('⚠ could not load shared link: '+e.message); return false; }
}
window.addEventListener('hashchange',async()=>{
  const h=location.hash||'';
  if(h.startsWith('#w=')||h.startsWith('#j=')) await loadFromHash(h);
});
